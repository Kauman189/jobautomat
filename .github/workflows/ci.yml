name: CI

on:
  push:
    branches: [main]
    # The v* tags are only used to publish the image to GHCR (publish job).
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) The image is built exactly as docker compose uses it (no secrets).
  docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build --tag jobautomat:ci .

      - name: Comprobar la imagen
        run: |
          docker image inspect jobautomat:ci --format '{{.Id}} {{.Config.User}} {{.Config.WorkingDir}}'
          docker run --rm --entrypoint python jobautomat:ci -c "import sys; print(sys.version)"

  # 2) Python dependencies + import smoke test of the service modules.
  python:
    name: Smoke de import (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r service/requirements.txt

      - name: Smoke de import
        env:
          PYTHONPATH: service
        run: |
          python - <<'PY'
          import importlib

          modulos = [
              "config",
              "db",
              "llm",
              "rate",
              "offer",
              "scoring",
              "generate",
              "pdf_gen",
              "notify",
              "apply",
              "apply_form",
              "followup",
              "first_run",
              "web",
              "main",
              "search",
              "search.boards",
              "search.jobspy",
              "search.linkedin",
          ]
          for nombre in modulos:
              importlib.import_module(nombre)
              print("import ok:", nombre)
          PY

  # 3) Lint: ruff (rules and formatting from pyproject.toml) + all of service/ compiles.
  lint:
    name: Ruff + py_compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: py_compile de service/
        run: |
          find service -name '*.py' -not -path '*/.venv/*' -print0 \
            | xargs -0 python -m py_compile
          echo "Todos los módulos de service/ compilan."

  # 4) Tests with pytest + coverage. Dependencies in requirements-dev.txt
  #    (pytest, flask, ruff, coverage). The threshold (11 %) lives here and
  #    pyproject.toml defines the scope ([tool.coverage.*]).
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: pytest con cobertura
        env:
          PYTHONPATH: service
        run: coverage run -m pytest tests/ -q

      - name: Informe de cobertura (umbral 11 %)
        env:
          PYTHONPATH: service
        run: coverage report --fail-under=11

  # 5) Publishing the multi-arch image to GHCR.
  #    Only on push of v* tags and on manual runs (workflow_dispatch):
  #    never on regular pushes to main, to avoid burning CI minutes.
  publish:
    name: Publicar imagen en GHCR (amd64+arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [docker, python, lint, test]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: QEMU (emulación arm64)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags de la imagen)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kauman189/jobautomat
          # Always ':latest'; plus ':<git tag>' (e.g. :v1.2.0) when the
          # trigger is a tag. On workflow_dispatch only :latest is published.
          tags: |
            type=raw,value=latest
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=jobautomat
            org.opencontainers.image.description=Servicio de búsqueda de empleo (Python 3.12 + patchright/Chromium)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build y push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "Imagen publicada con los tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
